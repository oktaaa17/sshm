<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#141B26"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5FD7FF"/>
    </marker>
  </defs>

  <rect width="1120" height="420" rx="16" fill="url(#bg2)"/>

  <text x="44" y="50" fill="#5FD7FF" font-size="22" font-weight="700">Windows Publisher &amp; SmartScreen Trust Pipeline</text>
  <text x="44" y="74" fill="#8B949E" font-size="13.5">Designed to run with Windows Defender &amp; SmartScreen 100% ENABLED — zero AV exclusions, zero UAC elevation</text>
  <line x1="44" y1="90" x2="1076" y2="90" stroke="#263040" stroke-width="1.5"/>

  <!-- Step 1 -->
  <rect x="44" y="120" width="218" height="214" rx="12" fill="#161B22" stroke="#5FD7FF" stroke-width="1.5"/>
  <rect x="60" y="136" width="64" height="24" rx="12" fill="#112B3C"/>
  <text x="92" y="152" text-anchor="middle" fill="#5FD7FF" font-size="11.5" font-weight="700">STEP 1</text>
  <text x="60" y="184" fill="#F0F6FC" font-size="15" font-weight="700">Security Gates</text>
  <text x="60" y="210" fill="#C9D1D9" font-size="12.5">• go vet ./...</text>
  <text x="60" y="232" fill="#C9D1D9" font-size="12.5">• go test -race ./...</text>
  <text x="60" y="254" fill="#C9D1D9" font-size="12.5">• govulncheck ./...</text>
  <text x="60" y="276" fill="#C9D1D9" font-size="12.5">• gosec -severity medium</text>
  <text x="60" y="310" fill="#87D787" font-size="12" font-weight="600">0 High/Critical CVEs</text>

  <line x1="262" y1="227" x2="296" y2="227" stroke="#5FD7FF" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="302" y="120" width="228" height="214" rx="12" fill="#161B22" stroke="#87D787" stroke-width="1.5"/>
  <rect x="318" y="136" width="64" height="24" rx="12" fill="#142C1F"/>
  <text x="350" y="152" text-anchor="middle" fill="#87D787" font-size="11.5" font-weight="700">STEP 2</text>
  <text x="318" y="184" fill="#F0F6FC" font-size="15" font-weight="700">Clean PE Build</text>
  <text x="318" y="210" fill="#C9D1D9" font-size="12.5">• CGO_ENABLED=0</text>
  <text x="318" y="232" fill="#C9D1D9" font-size="12.5">• -trimpath reproducible</text>
  <text x="318" y="254" fill="#C9D1D9" font-size="12.5">• PE VersionInfo (Oktanetflow)</text>
  <text x="318" y="276" fill="#C9D1D9" font-size="12.5">• asInvoker Manifest (No UAC)</text>
  <text x="318" y="310" fill="#FF7B72" font-size="12" font-weight="600">NO UPX / NO Packers</text>

  <line x1="530" y1="227" x2="564" y2="227" stroke="#5FD7FF" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="570" y="120" width="234" height="214" rx="12" fill="#161B22" stroke="#AF87FF" stroke-width="1.5"/>
  <rect x="586" y="136" width="64" height="24" rx="12" fill="#231936"/>
  <text x="618" y="152" text-anchor="middle" fill="#AF87FF" font-size="11.5" font-weight="700">STEP 3</text>
  <text x="586" y="184" fill="#F0F6FC" font-size="15" font-weight="700">Sign &amp; Attest</text>
  <text x="586" y="210" fill="#C9D1D9" font-size="12.5">• Inno Setup 6 Per-User EXE</text>
  <text x="586" y="232" fill="#C9D1D9" font-size="12.5">• Authenticode / Trusted Sign</text>
  <text x="586" y="254" fill="#C9D1D9" font-size="12.5">• RFC 3161 Timestamp</text>
  <text x="586" y="276" fill="#C9D1D9" font-size="12.5">• SHA256SUMS + Attestation</text>
  <text x="586" y="310" fill="#AF87FF" font-size="12" font-weight="600">Microsoft WDSI Ready</text>

  <line x1="804" y1="227" x2="838" y2="227" stroke="#5FD7FF" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="844" y="120" width="232" height="214" rx="12" fill="#161B22" stroke="#FFAF5F" stroke-width="1.5"/>
  <rect x="860" y="136" width="64" height="24" rx="12" fill="#332312"/>
  <text x="892" y="152" text-anchor="middle" fill="#FFAF5F" font-size="11.5" font-weight="700">STEP 4</text>
  <text x="860" y="184" fill="#F0F6FC" font-size="15" font-weight="700">User Verification</text>
  <text x="860" y="210" fill="#C9D1D9" font-size="12.5">• Get-FileHash -SHA256</text>
  <text x="860" y="232" fill="#C9D1D9" font-size="12.5">• Get-AuthenticodeSignature</text>
  <text x="860" y="254" fill="#C9D1D9" font-size="12.5">• gh attestation verify</text>
  <text x="860" y="276" fill="#C9D1D9" font-size="12.5">• Installs to %LOCALAPPDATA%</text>
  <text x="860" y="310" fill="#87D787" font-size="12" font-weight="600">Defender Stays ON</text>

  <text x="44" y="390" fill="#6E7681" font-size="12">See docs/WINDOWS_PUBLISHER_GUIDE.md &amp; ADR-003 for full signing and WDSI procedures.</text>
  <text x="1076" y="390" text-anchor="end" fill="#6E7681" font-size="12">Copyright © 2026 Oktanetflow</text>
</svg>

name: Release Windows Binary & EXE Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without leading v, e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-windows:
    name: Build, Sign & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Run security & test gates before release
        shell: pwsh
        run: |
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Generate Win32 PE metadata & build reproducible binaries
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          go generate ./cmd/sshm
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w -X github.com/Oktanetflow/sshm/internal/cli.Version=$v" -o dist/sshm.exe ./cmd/sshm
          Copy-Item dist/sshm.exe "dist/sshm-$v-windows-amd64.exe"

          $env:GOARCH = "arm64"
          go build -trimpath -ldflags "-s -w -X github.com/Oktanetflow/sshm/internal/cli.Version=$v" -o "dist/sshm-$v-windows-arm64.exe" ./cmd/sshm

      - name: Sign binaries with Authenticode PFX (if configured)
        if: env.AUTHENTICODE_PFX_BASE64 != ''
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $pfxPath = Join-Path $env:RUNNER_TEMP "oktanetflow-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:AUTHENTICODE_PFX_BASE64))
          try {
            .\packaging\windows\sign.ps1 -Files @("dist/sshm.exe", "dist/sshm-$v-windows-amd64.exe", "dist/sshm-$v-windows-arm64.exe") -PfxPath $pfxPath -PfxPassword $env:AUTHENTICODE_PFX_PASSWORD
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build Inno Setup per-user EXE installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          iscc "/DMyAppVersion=$v" packaging/windows/sshm.iss

      - name: Sign installer with Authenticode PFX (if configured)
        if: env.AUTHENTICODE_PFX_BASE64 != ''
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $pfxPath = Join-Path $env:RUNNER_TEMP "oktanetflow-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:AUTHENTICODE_PFX_BASE64))
          try {
            .\packaging\windows\sign.ps1 -Files @("dist/sshm-setup-$v-amd64.exe") -PfxPath $pfxPath -PfxPassword $env:AUTHENTICODE_PFX_PASSWORD
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $files = @(
            "dist/sshm-$v-windows-amd64.exe",
            "dist/sshm-$v-windows-arm64.exe",
            "dist/sshm-setup-$v-amd64.exe"
          )
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $(Split-Path -Leaf $f)"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ASCII
          Get-Content dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/sshm-${{ steps.ver.outputs.version }}-windows-amd64.exe
            dist/sshm-${{ steps.ver.outputs.version }}-windows-arm64.exe
            dist/sshm-setup-${{ steps.ver.outputs.version }}-amd64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sshm-${{ steps.ver.outputs.version }}-windows-amd64.exe
            dist/sshm-${{ steps.ver.outputs.version }}-windows-arm64.exe
            dist/sshm-setup-${{ steps.ver.outputs.version }}-amd64.exe
            dist/SHA256SUMS.txt
